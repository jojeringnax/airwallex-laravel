name: Package checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        dependencies: [lowest, latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite
          coverage: none
          tools: composer:2.11.2
      - run: composer validate --strict
      - name: Resolve dependencies
        run: |
          if [ "${{ matrix.dependencies }}" = lowest ]; then
            composer update --prefer-lowest --prefer-stable --prefer-dist --no-interaction
          else
            composer update --prefer-dist --no-interaction
          fi
      - run: composer check
      - run: composer check:dependencies
      - run: python3 tools/test_qualify_candidate.py
      - name: Qualify exact archive in a fresh native consumer
        run: |
          curl --fail --location --silent --show-error --retry 3 https://getcomposer.org/download/2.11.2/composer.phar --output "$RUNNER_TEMP/airwallex-composer.phar"
          python3 tools/qualify-candidate.py \
            --candidate "$(git rev-parse HEAD)" \
            --composer "$RUNNER_TEMP/airwallex-composer.phar" \
            --dependencies "${{ matrix.dependencies }}" \
            --workspace "$RUNNER_TEMP/airwallex-workspace" \
            --output "$RUNNER_TEMP/airwallex-evidence"
      - name: Record exact dependency resolution
        run: composer show --format=json > dependency-versions.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependencies-php${{ matrix.php }}-${{ matrix.dependencies }}
          path: |
            composer.lock
            dependency-versions.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consumer-php${{ matrix.php }}-${{ matrix.dependencies }}
          path: ${{ runner.temp }}/airwallex-evidence/
          if-no-files-found: warn
